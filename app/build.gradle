plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.autoride.accepter'
    compileSdk 36

    defaultConfig {
        applicationId "com.autoride.accepter"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "UPI_PAYEE_VPA", '"merchant@upi"'
        buildConfigField "String", "UPI_PAYEE_NAME", '"Auto Ride Accepter"'
        buildConfigField "boolean", "ALLOW_LOCAL_SUBSCRIPTION_ACTIVATION", "false"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "AutoRideAccepter_Latest.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
}

task copyApk(type: Copy) {
    from("${project.buildDir}/outputs/apk/debug/AutoRideAccepter_Latest.apk")
    into("${project.rootDir}/release_apk")
    dependsOn 'assembleDebug'
}
