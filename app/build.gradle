plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { input ->
        localProperties.load(input)
    }
}

def envOrProp = { String key ->
    def value = project.findProperty(key) ?: System.getenv(key)
    if (value == null || value.toString().trim().isEmpty()) {
        value = localProperties.getProperty(key)
    }
    (value ?: "").toString()
}

android {
    namespace 'com.autoride.accepter'
    compileSdk 36

    def supabaseUrl = envOrProp("SUPABASE_URL")
    def supabaseAnonKey = envOrProp("SUPABASE_ANON_KEY")
    def supabaseProjectRef = envOrProp("SUPABASE_PROJECT_REF").trim()
    if (supabaseProjectRef.isEmpty()) {
        supabaseProjectRef = "kggaugweermsmelggpme"
    }
    if (supabaseUrl.trim().isEmpty() && !supabaseProjectRef.isEmpty()) {
        supabaseUrl = "https://${supabaseProjectRef}.supabase.co"
    }

    defaultConfig {
        applicationId "com.autoride.accepter"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.0.7"
        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\""
        buildConfigField "boolean", "LOCAL_ACCESS_MODE", "${envOrProp("LOCAL_ACCESS_MODE").trim().equalsIgnoreCase("false") ? "false" : "true"}"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "BhadaAccepter_Latest.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
}

task copyApk(type: Copy) {
    from("${project.buildDir}/outputs/apk/debug/BhadaAccepter_Latest.apk")
    into("${project.rootDir}/release_apk")
    dependsOn 'assembleDebug'
}
