name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run lint and unit tests
        run: ./gradlew --no-daemon app:lint app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon app:assembleDebug app:copyApk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoRideAccepter-debug-apk
          path: |
            app/build/outputs/apk/debug/BhadaAccepter_Latest.apk
            release_apk/BhadaAccepter_Latest.apk
          if-no-files-found: error

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
